# ─────────────────────────────────────────────────────────────────────────────
# Local development profile
#
# Credentials are NOT declared here. They are inherited from the environment via
# application.properties (DB_USERNAME / DB_PASSWORD / STORAGE_*), which docker
# compose and your shell both read from the repo-root .env file.
#
# This file previously committed `spring.datasource.username=web` and
# `spring.datasource.password=web`. Those are removed; if you have an existing
# local database using them, either recreate it with tools/local/initdb.sql or
# set DB_USERNAME=web / DB_PASSWORD=web in your own .env.
# ─────────────────────────────────────────────────────────────────────────────

spring.cloud.gcp.sql.enabled=false

# Point MinIO at path-style addressing; virtual-host style needs DNS wildcards.
spring.cloud.aws.s3.path-style-access-enabled=true

# SQL debugging — uncomment when diagnosing a query.
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.orm.jdbc.bind=TRACE

logging.level.org.pianoml.backend=DEBUG
