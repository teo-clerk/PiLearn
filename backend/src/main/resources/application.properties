spring.application.name=backend

# ─────────────────────────────────────────────────────────────────────────────
# Datasource
# All environment-specific values come from the environment. No committed
# credentials, no committed hostnames. See .env.example at the repo root.
# ─────────────────────────────────────────────────────────────────────────────
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pianoml}
spring.datasource.username=${DB_USERNAME:pilearn}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.cloud.gcp.sql.enabled=false

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.liquibase.default-schema=pianoml

spring.main.lazy-initialization=true
server.tomcat.max-threads=50

# ─────────────────────────────────────────────────────────────────────────────
# Security
# jwt.secret has NO default on purpose. The app must refuse to start without it
# rather than sign tokens with a well-known key. Validated in JwtProperties.
#   generate:  openssl rand -base64 64 | tr -d '\n'
#
# NOTE: jwt.expiration-ms was previously declared here but ignored — the @Value
# binding in JwtTokenProvider was commented out and the lifetime was hardcoded
# to 24h. It is now honoured, so the default below preserves the old effective
# behaviour (86400000 ms = 24h) rather than the old declared value (1h).
# ─────────────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ─────────────────────────────────────────────────────────────────────────────
# Object storage (S3-compatible: MinIO locally, Cloudflare R2 in production)
# ─────────────────────────────────────────────────────────────────────────────
aws.s3.bucket-name=${STORAGE_BUCKET:pilearn-media}
spring.cloud.aws.region.static=${STORAGE_REGION:us-east-1}
spring.cloud.aws.endpoint=${STORAGE_ENDPOINT}
spring.cloud.aws.credentials.access-key=${STORAGE_ACCESS_KEY}
spring.cloud.aws.credentials.secret-key=${STORAGE_SECRET_KEY}
spring.cloud.aws.s3.path-style-access-enabled=${STORAGE_PATH_STYLE_ACCESS:true}

# ─────────────────────────────────────────────────────────────────────────────
# External APIs (optional — features degrade gracefully when unset)
# ─────────────────────────────────────────────────────────────────────────────
youtube.api.key=${YOUTUBE_API_KEY:}

# ─────────────────────────────────────────────────────────────────────────────
# File upload limits (enforced again at the ingestion boundary)
# ─────────────────────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=52MB

# ─────────────────────────────────────────────────────────────────────────────
# SpringDoc / OpenAPI
# ─────────────────────────────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
