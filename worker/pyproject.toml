[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pilearn-worker"
version = "0.1.0"
description = "PiLearn OMR ingestion and pedagogy analysis worker"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }

# Exact pins. This service orchestrates native tools (MuseScore, homr, Audiveris) whose
# behaviour is version-sensitive, and its output is compared against committed golden
# snapshots. A floating dependency turns a green baseline red for no reviewable reason.
dependencies = [
    # ── Web layer ────────────────────────────────────────────────────────────
    "fastapi==0.118.0",
    "uvicorn[standard]==0.37.0",
    "python-multipart==0.0.20",      # multipart/form-data uploads
    "pydantic==2.12.4",
    "pydantic-settings==2.7.1",

    # ── Queue / job state ────────────────────────────────────────────────────
    # Redis backs the shared job store. Celery is deliberately NOT used: ingestion is
    # one long CPU-bound subprocess per job, not a fan-out of small tasks, and Cloud Run
    # scales the container itself. A broker plus a worker pool would add an operational
    # component that buys nothing here.
    "redis==5.2.1",

    # ── Music / notation ─────────────────────────────────────────────────────
    "music21==9.1.0",                # parsing, key analysis, chordify, cadences
    "mido==1.3.3",                   # MIDI read/write
    "pypdf==5.1.0",                  # authoritative source page count

    # ── Storage ──────────────────────────────────────────────────────────────
    "boto3==1.35.92",                # S3 / MinIO / Cloudflare R2
    "botocore==1.35.92",

    # ── Runtime ──────────────────────────────────────────────────────────────
    "httpx==0.28.1",
    "structlog==24.4.0",
    "tenacity==9.0.0",               # retry with backoff around native tools
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "pytest-cov==6.0.0",
    "ruff==0.8.6",
    "mypy==1.14.1",
    "types-redis==4.6.0.20241004",
]

[project.scripts]
pilearn-worker = "pilearn_worker.main:run"

[tool.setuptools.packages.find]
include = ["pilearn_worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"
markers = [
    # Tests needing music21 or the native OMR toolchain. Deselect with:
    #   pytest -m "not requires_music21 and not requires_toolchain"
    "requires_music21: needs music21 installed",
    "requires_toolchain: needs homr/MuseScore/Audiveris in the image",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI's Depends()/File() in defaults is the documented idiom

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
# music21 ships no type stubs and is not going to.
[[tool.mypy.overrides]]
module = ["music21.*", "mido.*"]
ignore_missing_imports = true
